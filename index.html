<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cool Panda</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>:root{--p:#fe2c55}*{box-sizing:border-box}body{margin:0;background:#101014;color:white;font-family:Arial}.wrap{max-width:1000px;margin:auto;padding:20px}.hero,.panel,.account{background:#1b1b22;border:1px solid #393943;border-radius:16px;padding:18px;margin:12px 0}.hero{background:linear-gradient(120deg,#25131d,#152528)}.brand{font-size:30px;font-weight:bold}.brand span{color:var(--p)}.muted{color:#aaa}input,button{font:inherit;padding:12px;border-radius:10px;margin:4px;border:1px solid #454550;background:#111;color:white}input{width:100%}button{background:var(--p);border:0;font-weight:bold}button.alt{background:#34343d}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}.account a{color:white}.coin{color:#ffd76a}.tabs{display:flex;flex-wrap:wrap;gap:6px}</style></head><body><main class="wrap"><header class="hero"><div class="brand">🐼 Cool <span>Panda</span></div><p id="welcome" class="muted">أهلاً بيك في إدارة حسابات TikTok</p></header>
<section id="config" class="panel"><h3>إعداد الاتصال بقاعدة البيانات</h3><p class="muted">استخدم رابط Supabase وPublishable key فقط. ممنوع وضع Secret أو Service Role Key هنا.</p><input id="sburl" placeholder="https://xxxx.supabase.co"><input id="sbkey" placeholder="Supabase Publishable / anon key"><button onclick="connect()">حفظ والاتصال</button><p id="configmsg" class="muted"></p></section>
<section id="auth" class="panel hidden"><h3>تسجيل الدخول</h3><input id="email" type="email" placeholder="البريد الإلكتروني"><input id="password" type="password" placeholder="كلمة المرور"><button onclick="signIn()">دخول</button><button class="alt" onclick="signUp()">إنشاء حساب</button><button class="alt" onclick="showConfig()">إعدادات الاتصال</button><p id="authmsg" class="muted"></p></section>
<section id="app" class="hidden"><div class="panel"><span id="who"></span> <button class="alt" onclick="signOut()">خروج</button><div class="tabs"><button onclick="tab('available')">الحسابات المتاحة</button><button class="alt" onclick="tab('visited')">اللي زرتها</button><button id="adminTab" class="alt hidden" onclick="tab('admin')">لوحة الأدمن</button></div></div><div id="available" class="panel"><h3>الحسابات المتاحة</h3><input id="search" placeholder="ابحث عن يوزر" oninput="renderAccounts()"><div id="accounts" class="grid"></div></div><div id="visited" class="panel hidden"><h3>سجل زياراتي</h3><div id="visits" class="grid"></div></div><div id="admin" class="panel hidden"><h3>لوحة الأدمن</h3><input id="newuser" placeholder="TikTok username"><input id="newcoins" type="number" placeholder="Coins"><button onclick="addAccount()">إضافة حساب</button><p>استيراد Excel/CSV بأعمدة username و coins و url (اختياري)</p><input id="file" type="file" accept=".xlsx,.xls,.csv"><button onclick="importFile()">استيراد الملف</button><input id="welcomeEdit" placeholder="رسالة الترحيب"><button onclick="saveWelcome()">حفظ الترحيب</button><p id="adminmsg" class="muted"></p></div></section></main>
<script>
let sb,me,profile,all=[];const $=x=>document.getElementById(x);const msg=(id,t)=>$(id).textContent=String(t||'');
function showConfig(){$('config').classList.remove('hidden');$('auth').classList.add('hidden');$('app').classList.add('hidden');$('sburl').value=localStorage.getItem('cp_url')||'';$('sbkey').value=localStorage.getItem('cp_key')||''}
async function connect(){let u=$('sburl').value.trim(),k=$('sbkey').value.trim();if(!/^https:\/\/[\w-]+\.supabase\.co\/?$/i.test(u)||!k){msg('configmsg','راجع الرابط والمفتاح.');return}localStorage.setItem('cp_url',u.replace(/\/$/,''));localStorage.setItem('cp_key',k);await init()}
async function init(){try{let u=localStorage.getItem('cp_url'),k=localStorage.getItem('cp_key');if(!u||!k)return showConfig();if(!window.supabase)throw Error('تعذر تحميل مكتبة الاتصال. افحص الإنترنت.');sb=window.supabase.createClient(u,k);$('config').classList.add('hidden');$('auth').classList.remove('hidden');let {data,error}=await sb.auth.getSession();if(error)throw error;if(data.session)await loadApp()}catch(e){$('config').classList.remove('hidden');msg('configmsg','خطأ اتصال: '+(e.message||e))}}
async function signUp(){try{let {data,error}=await sb.auth.signUp({email:$('email').value.trim(),password:$('password').value});if(error)throw error;msg('authmsg',data.user?.identities?.length===0?'البريد مسجل بالفعل.':'تم طلب إنشاء الحساب. افحص بريدك إن كان تأكيد البريد مفعلاً.')}catch(e){msg('authmsg','خطأ إنشاء الحساب: '+(e.message||e))}}
async function signIn(){try{let {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;await loadApp()}catch(e){msg('authmsg','خطأ تسجيل الدخول: '+(e.message||e))}}
async function signOut(){await sb.auth.signOut();location.reload()}
async function loadApp(){try{let {data:{user},error}=await sb.auth.getUser();if(error)throw error;me=user;let r=await sb.from('profiles').select('*').eq('id',me.id).maybeSingle();if(r.error)throw r.error;if(!r.data)throw Error('لا يوجد سجل للمستخدم في profiles؛ يلزم إعداد إنشاء profile تلقائياً عند التسجيل.');profile=r.data;$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=me.email+(profile.role==='admin'?' — أدمن':'');$('adminTab').classList.toggle('hidden',profile.role!=='admin');$('welcome').textContent=profile.welcome_message||'أهلاً بيك في Cool Panda';await refresh()}catch(e){msg('authmsg','تعذر تحميل الحساب: '+(e.message||e))}}
async function refresh(){let {data,error}=await sb.from('accounts').select('*').order('created_at',{ascending:false});if(error){alert(error.message);return}all=data||[];await renderAccounts();await renderVisits()}
async function renderAccounts(){if(!me)return;let {data,error}=await sb.from('visits').select('account_id').eq('user_id',me.id);if(error){$('accounts').textContent=error.message;return}let seen=new Set((data||[]).map(x=>x.account_id)),q=$('search').value.toLowerCase();$('accounts').innerHTML=all.filter(a=>!seen.has(a.id)&&String(a.username).toLowerCase().includes(q)).map(a=>`<article class="account"><a target="_blank" rel="noopener" href="${safe(a.url)}" onclick="visit('${a.id}')">@${esc(a.username)}</a><p class="coin">🪙 ${Number(a.coins)||0} Coins</p></article>`).join('')||'<p>لا توجد حسابات متاحة.</p>'}
async function visit(id){let {error}=await sb.from('visits').upsert({user_id:me.id,account_id:id},{onConflict:'user_id,account_id'});if(error)alert(error.message);else setTimeout(refresh,500)}
async function renderVisits(){let {data,error}=await sb.from('visits').select('id,contacted,accounts(username,url,coins)').eq('user_id',me.id).order('visited_at',{ascending:false});if(error){$('visits').textContent=error.message;return}$('visits').innerHTML=(data||[]).filter(v=>v.accounts).map(v=>`<article class="account"><a target="_blank" href="${safe(v.accounts.url)}">@${esc(v.accounts.username)}</a><p class="coin">🪙 ${Number(v.accounts.coins)||0} Coins</p><p>${v.contacted?'تم التواصل':'لم يتم التواصل'}</p><button class="alt" onclick="toggleContact('${v.id}',${!v.contacted})">تغيير حالة التواصل</button></article>`).join('')||'<p>لم تزر حسابات بعد.</p>'}
async function toggleContact(id,val){let {error}=await sb.from('visits').update({contacted:val}).eq('id',id);if(error)alert(error.message);else renderVisits()}
async function addAccount(){try{if(profile.role!=='admin')throw Error('غير مصرح');let username=$('newuser').value.trim().replace(/^@/,''),coins=Number($('newcoins').value||0);if(!username)throw Error('اكتب اسم المستخدم');let {error}=await sb.from('accounts').upsert({username,url:'https://www.tiktok.com/@'+encodeURIComponent(username),coins},{onConflict:'username'});if(error)throw error;msg('adminmsg','تم الحفظ');refresh()}catch(e){msg('adminmsg',e.message)}}
async function importFile(){try{if(profile.role!=='admin')throw Error('غير مصرح');let f=$('file').files[0];if(!f)throw Error('اختار ملف');let wb=XLSX.read(await f.arrayBuffer()),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]),records=rows.map(r=>{let username=String(r.username||r.Username||r.user||r.User||'').replace(/^@/,'').trim();return{username,url:r.url||r.URL||'https://www.tiktok.com/@'+encodeURIComponent(username),coins:Number(r.coins??r.Coins??0)}}).filter(x=>x.username);if(!records.length)throw Error('لم أجد عمود username');let {error}=await sb.from('accounts').upsert(records,{onConflict:'username'});if(error)throw error;msg('adminmsg',`تم استيراد ${records.length} حساب`);refresh()}catch(e){msg('adminmsg','فشل الاستيراد: '+e.message)}}
async function saveWelcome(){try{if(profile.role!=='admin')throw Error('غير مصرح');let {error}=await sb.from('profiles').update({welcome_message:$('welcomeEdit').value}).eq('id',me.id);if(error)throw error;msg('adminmsg','تم الحفظ')}catch(e){msg('adminmsg',e.message)}}
function tab(id){['available','visited','admin'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function safe(u){try{let x=new URL(u);return x.protocol==='https:'?x.href:'#'}catch{return '#'}}
if(localStorage.getItem('cp_url')&&localStorage.getItem('cp_key'))init();else showConfig();
</script></body></html>
